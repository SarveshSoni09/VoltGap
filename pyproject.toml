[project]
name = "voltgap"
version = "0.1.0"
description = "VoltGap — open decision support for EV charging infrastructure siting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "pyogrio>=0.9",
    "h3>=4.0",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
voltgap-probe = "pipeline.discovery.probe:main"
voltgap-lint = "pipeline.quality.copy_lint:main"
voltgap-identify = "pipeline.quality.identifiability:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
# No python_version pin: mypy checks against the interpreter actually in use, which
# is the 3.12 the project pins with uv. Pinning 3.11 here made the bundled numpy
# stubs unparseable.
strict = true
warn_unreachable = true
files = ["pipeline", "tests"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "pyogrio.*", "duckdb.*", "h3.*", "pulp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-network tests are EXCLUDED BY DEFAULT. The deterministic phase gates must stay
# network-independent, so a plain `pytest` run - which is what `make gate` invokes -
# never touches an external service. Run them deliberately with `-m live`, or through
# `make live-smoke` / `make live-integration` / `make integration-assurance`.
addopts = '-q --strict-markers -m "not live"'
markers = [
    "live: hits a production endpoint; excluded from the deterministic gate by default",
]
filterwarnings = [
    "error::DeprecationWarning:pipeline.*",
    # PuLP 3.x warns that LpVariable construction and PULP_CBC_CMD change in 4.0. The
    # pinned range is 2.8-3.x, the behaviour is correct today, and the migration is
    # recorded in docs/FUTURE_WORK.md rather than silenced and forgotten.
    "ignore:Constructing LpVariable:DeprecationWarning",
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["pipeline"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
