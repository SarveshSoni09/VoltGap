# Pull-request CI. CLAUDE.md §13.1 and §11.3.
#
# Every job INVOKES AN EXISTING ACCEPTED CHECK — the same `make` target the Phase 6 gate
# runs — rather than reimplementing its logic. A workflow that restated a threshold would
# be a second place for it to be wrong, and the two would drift.
#
# SCOPE: Phase 6 acceptance plumbing only. No scheduled refresh, no keepalive, no
# deployment, no health monitoring — those are Phase 7 (§13.2, §13.3) and are deliberately
# absent from this file.
#
# ON "LIGHTHOUSE CI". §11.3 says "Lighthouse CI runs on every PR". This uses the Lighthouse
# **Node API** through `web/scripts/perf-tti.mjs`, not `@lhci/cli`. Deliberate: the budget
# is one specific audit under one pinned throttling profile, asserted with a non-zero exit.
# That is what the Node API gives directly and what `lhci` would wrap in a second
# configuration surface with its own thresholds to drift from ours. The requirement it must
# satisfy is "runs automatically on PRs and fails the PR on breach".
#
# TWO ENFORCEMENT CLASSES (CLAUDE.md §11.3, amendment A27, approved 2026-09-01):
#
#   * PORTABLE budgets keep their accepted semantics on any runner, so they are hard gates
#     here: the app shell (<= 600 KB gzipped) and the greedy state solve (<= 2.0 s).
#   * ENVIRONMENT-DEPENDENT budgets — time to interactive and sustained frame rate — are
#     hard gates in the authoritative gate on a documented reference environment, because
#     direct measurement showed their semantics do not survive a GitHub-hosted runner:
#     a GPU-less Chrome here serves NO WebGL context at all, and Lighthouse `simulate`
#     derives CPU task durations from a trace taken on the host.
#
# This workflow does NOT measure the second class. It PROTECTS it, with the seven
# assertions §11.3 requires, run as `make web-perf-guards`. Nothing is measured with
# weakened semantics and no proxy stands in for a budget.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # =================================================================================
  # Enforced here, with identical semantics to the gate. These need no source data and
  # no GPU, so they are hard gates with no caveats.
  # =================================================================================
  python:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: ruff and mypy --strict
        run: make lint
      - name: D3 terminology copy lint (source, docs and frontend)
        run: make copy-lint
      - name: Gate-protocol regression suite
        # Reads only the Makefile, the workflow and the scripts, so it runs without the
        # source-data cache. It is what stops this workflow silently losing a job.
        run: .venv/bin/python -m pytest tests/regression/test_gate_protocol.py -q
      - name: CI workflow regression suite
        run: .venv/bin/python -m pytest tests/regression/test_ci_workflow.py -q
      - name: PROTECT the environment-dependent budgets (§11.3, amendment A27)
        # Does not measure TTI or frame rate. Asserts their harnesses are present and
        # executable, their thresholds are neither duplicated nor changed, their validity
        # guards are intact, no fallback metric may replace TTI, and the benchmark
        # provenance and reference-environment metadata exist.
        run: make web-perf-guards

  frontend:
    name: Frontend typecheck, build, tests, app-shell budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: make web-install
      - name: Typecheck
        run: make web-typecheck
      - name: Build the static export
        run: make web-build
      - name: Frontend tests
        # Fixtures are committed, including the real 3,532-cell Texas surface, so the
        # greedy port and the 2-second solve budget are genuinely exercised here.
        run: make web-test
      - name: PORTABLE budget — app shell <= 600 KB gzipped (§11.3)
        # Deterministic: gzip of the emitted files. Identical semantics to the gate.
        run: make web-budget
      - name: PORTABLE budget — greedy state solve <= 2.0 s (§11.3)
        # The accepted real Texas fixture: 3,532 published cells, the largest frontier
        # state. CPU-bound JavaScript with a large margin, so it holds on any runner.
        run: make web-perf-greedy

  # =================================================================================
  # Enforced here ONLY where the prerequisite exists. Each job runs the accepted harness
  # unchanged, including its refusal to report a number it cannot stand behind.
  # =================================================================================
  tti:
    name: Time to Interactive budget (§11.3, <= 3.0 s)
    # Needs the published artifacts, which need the source cache. Point this at a runner
    # that has `data/cache/` to enforce it. Skipped, not faked, when unset.
    if: vars.PERF_DATA_RUNNER != ''
    runs-on: ${{ vars.PERF_DATA_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          make web-install
      - name: Build artifacts and the static export
        run: make artifacts && make web-build
      - name: Measure and enforce
        # The accepted harness, unchanged. It refuses to report unless the page under test
        # actually holds >= 50,000 cells: without the artifacts the error state measures
        # 0.96 s and "passes", which is the worst kind of green.
        run: make web-perf-tti

  fps:
    name: Sustained frame rate budget (§11.3, >= 55 fps)
    # Needs the artifacts AND hardware rendering. Point this at a self-hosted GPU runner
    # that also has `data/cache/`. Skipped, not faked, when unset.
    if: vars.PERF_GPU_RUNNER != ''
    runs-on: ${{ vars.PERF_GPU_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          make web-install
      - name: Build artifacts and the static export
        run: make artifacts && make web-build
      - name: Measure and enforce
        # Unweakened: >= 50,000 rendered cells required, software rendering rejected,
        # absent WebGL rejected, and the measured quantity is the worst 1-second window.
        run: make web-perf-fps

  # =================================================================================
  # Always runs. States plainly which budgets this workflow enforces and which it does
  # not, so a green CI cannot be read as more than it is.
  # =================================================================================
  performance-enforcement-status:
    name: Which performance budgets this PR actually enforced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "PORTABLE class — enforced on this PR as hard gates:"
          echo "  App shell <= 600 KB gzipped   : ENFORCED (job 'frontend')"
          echo "  Greedy state solve <= 2.0 s   : ENFORCED (job 'frontend')"
          echo ""
          echo "ENVIRONMENT-DEPENDENT class (CLAUDE.md 11.3, amendment A27):"
          if [ -n "${{ vars.PERF_DATA_RUNNER }}" ]; then
            echo "  Time to Interactive <= 3.0 s  : ENFORCED (job 'tti')"
          else
            echo "  Time to Interactive <= 3.0 s  : NOT EXECUTED ON THIS RUNNER."
            echo "    This is not a PASS. Nothing was measured."
            echo "    Lighthouse 'simulate' derives CPU task durations from the host, so a"
            echo "    runner's absolute figure is not evidence about the 3.0 s budget."
            echo "    Enforced by 'make gate PHASE=6' on the reference environment."
          fi
          if [ -n "${{ vars.PERF_GPU_RUNNER }}" ]; then
            echo "  Sustained >= 55 fps           : ENFORCED (job 'fps')"
          else
            echo "  Sustained >= 55 fps           : NOT EXECUTED ON THIS RUNNER."
            echo "    This is not a PASS. Nothing was measured."
            echo "    GitHub-hosted runners have no GPU; Chrome there serves no WebGL at"
            echo "    all, so no frame rate exists. No software substitute is used."
            echo "    Enforced by 'make gate PHASE=6' on the reference environment."
          fi
          echo ""
          echo "  Both are PROTECTED on this PR by 'make web-perf-guards': harnesses"
          echo "  present and executable, thresholds unchanged and unduplicated, validity"
          echo "  guards intact, no fallback metric may replace TTI, and the benchmark"
          echo "  provenance and reference-environment metadata exist."
          echo ""
          echo "Full Python suite and coverage : NOT EXECUTED ON THIS RUNNER."
          echo "  Most tests read the git-ignored 4.4 GB source cache. Enforced by"
          echo "  'make gate PHASE=6'. Lint, types and the copy lint DO run here."
          echo ""
          echo "See CLAUDE.md 19 amendment A27 and docs/reports/PLAN_CHANGE_6.md."
      - name: The enforcement split must stay documented
        run: |
          grep -q "CI runner limits" docs/reports/PLAN_CHANGE_6.md
          grep -q "PERF_GPU_RUNNER" docs/reports/PLAN_CHANGE_6.md
          grep -q "PERF_DATA_RUNNER" docs/reports/PLAN_CHANGE_6.md
          grep -q "A27" CLAUDE.md
          grep -q "environment-dependent" CLAUDE.md
