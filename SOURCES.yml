  - id: nrel_home_charging
    name: NREL county EV home charging access shares
    tier: core
    retrieval:
      method: bulk_download
      endpoint: "https://data.nlr.gov/system/files/278/1734741167-NREL_county_EV_home_charging_access.xlsx"
      auth: none
      rate_limit: "none advertised"
    coverage:
      geographic: "3,142 US counties"
      temporal: "not a time series"
      historical_vintages_available: false
      vintage_field: "EV Share of Stock"
      vintage_semantics: >-
        NOT current values and NOT a single dated projection. The file is a parametric
        scenario surface: 942,600 rows = 3,142 counties x 3 access scenarios
        (baseline / low / high) x 100 EV-share-of-stock levels from 0.01 to 1.00.
        Home Charging Access is a function of assumed fleet EV penetration, published
        with the 2030 National Charging Network study.
    schema:
      join_keys: ["County FIPS"]
      stable_keys: true
      schema_version: null
      expected_field_count: 6
    quality:
      expected_row_count: [942600, 942600]
      drift_tolerance: 0.0
      expected_range_derivation: >-
        Exact, measured by parsing the workbook on 2026-08-19: 3,142 counties x 3
        scenarios x 100 EV-share levels = 942,600 rows on the C-Data sheet.
    license: "NREL Data Catalog terms; DOI 10.7799/2483609"
    update_cadence: "static publication"
    fallback_source: none
    used_by: [home_charging_exploratory_index]
    backtest_eligible: false
    known_limitations:
      - >-
        Because the shares are not present-day values, CLAUDE.md section 7.2's
        fallback path applies: home charging ships as a clearly labelled exploratory
        index, is EXCLUDED from the primary siting objective function, and is exposed
        only as a user-selectable weight with a sensitivity display.
      - >-
        The workbook declares the namespace http://purl.oclc.org/ooxml/spreadsheetml/main
        rather than the standard schemas.openxmlformats.org namespace, so openpyxl
        reports zero worksheets. It must be parsed from the underlying XML.
      - "Median baseline home charging access falls from 0.991 at 1% EV share to 0.489 at 100%."

