        Must be filtered by voltage and tiled. It is never loaded as GeoJSON in a
        browser, and the probe never parses it as a single object; it is read as a
        stream (domain rule G12).
      - >-
        94,216 features here against 52,244 in the live HIFLD service. The two
        extracts do not agree and the publisher does not document why.


# --------------------------------------------------------------------------------
# Phase 0 research findings
#
# These are conclusions no unit test can prove true, because their truth lives
# outside this repository. Each therefore carries a resolved value, the URL it came
# from, when it was retrieved, a supporting quote, and the SHA-256 of a cached
# evidence artifact under docs/evidence/, so the claim stays auditable if the source
# page later changes. The executable gate verifies resolution-with-evidence, never
# external truth.
# --------------------------------------------------------------------------------

findings:

  - id: F-1
    question: >-
      Does the AFDC charging units endpoint expose per-connector power_kw and
      port_count, and what is the measured missingness of each?
    resolved_value: >-
      YES to both, with per-connector granularity. The endpoint returns one row per
      charging unit with paired columns for five connector standards: 'EV
      {J1772|CCS|CHAdeMO|J3400|J3271} Connector Count' and 'EV {..} Power Output (kW)'.
      Connector counts are effectively complete (0.004% missing over 292,435 national
      unit rows). Power is present conditional on the connector existing at, port-
      weighted and nationally, 82.76% overall and 88.11% on the public + operational
      subset (Status Code = E and Access Code = public), which is the subset the supply
      model uses. Per connector, port-weighted: CCS 99.93%, CHAdeMO 99.86%, J1772
      81.36%, J3400 73.35%, J3271 100.00%. Rung-1 coverage is therefore far above the
      40% threshold in CLAUDE.md section 7.1, so no prominent LIMITATIONS.md entry is
      triggered on that ground.
    evidence_url: "https://developer.nlr.gov/docs/transportation/alt-fuel-stations-v1/ev-charging-units/"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Each row in the spreadsheet represents an EV charging unit that might have one or
      more ports and one or more connectors.
    evidence_artifact: "docs/evidence/F-1_afdc_connector_power_coverage.json"
    evidence_sha256: "69f46b7ddd5aa8ecbeac87ac16c32456f892e552d99afec86f3e90f22b3e6b24"

  - id: F-2
    question: >-
      Are the NREL county home charging access shares current values or 2030 scenario
      projections?
    resolved_value: >-
      NEITHER, and the distinction matters. They are a parametric scenario surface, not
      a dated observation: 942,600 rows = 3,142 counties x 3 access scenarios (baseline
      / low / high) x 100 levels of an 'EV Share of Stock' parameter running 0.01 to
      1.00. Home Charging Access is published as a function of assumed fleet EV
      penetration, from the 2030 National Charging Network study (Wood et al. 2023),
      modelled on Ge et al. (2021). Because they are not present-day values, CLAUDE.md
      section 7.2's fallback path applies: home charging access ships as a clearly
      labelled exploratory index, is EXCLUDED from the primary siting objective
      function, and is exposed only as a user-selectable weight with a sensitivity
      display.
    evidence_url: "https://data.nlr.gov/submissions/278"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Modeled county-level home electric vehicle (EV) charging access shares from the
      study, 'The 2030 National Charging Network: Estimating U.S. Light-Duty Demand for
      Electric Vehicle Charging Infrastructure' by Wood et al. (2023).
    evidence_artifact: "docs/evidence/F-2_nrel_home_charging_semantics.txt"
    evidence_sha256: "a11035f49567ca4b1d40c3c3387e2a5d3d08073df00434a5a05ff65b8be0e5f1"

  - id: F-3
    question: >-
      Do historical state-level EV registration vintages exist anywhere obtainable?
    resolved_value: >-
      YES, at both state and sub-state level, and no login is required for either. State
      level: AFDC publishes ten annual vintages, 2016 through 2025, one HTML table per
      year at afdc.energy.gov/vehicle-registration?year={year}, each with 51
      jurisdictions plus a 'United States' total row. Counts are rounded to the nearest
      100 and derive from Experian VIN data. Sub-state level: the Atlas EV Hub state DMV
      exports carry a repeated 'DMV Snapshot (Date)' series alongside per-vehicle
      'Registration Date', the earliest snapshot observed being 2017-12-31 for New
      Jersey. Consequence for CLAUDE.md section 10.2.3: the reconciliation constraint
      CAN be applied at the 2020, 2021 and 2022 backtest cutoffs, so the unconstrained-
      propensity fallback described there is NOT triggered. A secondary result: the
      delivered, undated seed file data/seed/EV_Registration_Counts_by_State.csv was
      dated to the 2023 vintage, because rounding its values half-up to the nearest 100
      reproduces the AFDC 2023 table for 51 of 51 jurisdictions (0 of 51 against 2022 or
      2024).
    evidence_url: "https://afdc.energy.gov/vehicle-registration"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Counts are rounded to the closest 100 vehicles and reflect the total number of
      light-duty registered vehicles through the selected year. Fuel types are based on
      vehicle identification numbers (VINs).
    evidence_artifact: "docs/evidence/F-3_state_registration_vintages.json"
    evidence_sha256: "dcbe5ab961afaebe2b30e05d449776dd6bc8312a9c65efae9e15afe248685951"

  - id: F-4
    question: >-
      Exactly which states have usable open sub-state EV registration data, at what
      granularity, and over what time period?
    resolved_value: >-
      Sixteen distinct states, from three independent sources, none login-gated. (1)
      Atlas EV Hub publishes 14 states with a uniform 13-column vehicle-grain schema:
      ZIP Code granularity for CO, CT, ME, MN, NC, NJ, NM, NY, OR, TX, VT (11 states)
      and County granularity for MT, TN, VA (3 states). Every file carries Registration
      Date, Vehicle Count, DMV Snapshot ID, DMV Snapshot (Date) and Latest DMV Snapshot
      Flag, so both current and historical vintages are reconstructable. File sizes run
      3.9 MB (MT) to 1.3 GB (NY). (2) Washington State publishes 294,193 vehicle rows on
      Socrata carrying _2020_census_tract, the ONLY census-tract-granularity
      registration source found, but as a current snapshot with no registration date, so
      it yields no historical vintages. (3) The delivered seed files add Illinois
      (county, 84 monthly observations 2017-11 to 2024-11) and Minnesota (county, single
      snapshot); Minnesota also appears in Atlas at ZIP grain. Bearing on later phases:
      11 of the 16 need a ZIP-to-tract crosswalk before they can be used at tract grain,
      and only Washington is natively tract-level.
    evidence_url: "https://www.atlasevhub.com/materials/state-ev-registration-data/"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Datasets should be updated on as frequent a basis as possible, ideally monthly or
      quarterly.
    evidence_artifact: "docs/evidence/F-4_tier_a_states.json"
    evidence_sha256: "11c1a5231b2baac1085cfc2b733f3e8b3ef6484c648193d5b636aacfeede42e5"

  - id: F-5
    question: >-
      Is the NREL developer API host named in the delivered SETUP.md still valid?
    resolved_value: >-
      NO. developer.nrel.gov has no DNS A record from any resolver tested and the NREL
      developer network has moved to developer.nlr.gov, the old domain having been
      retired on 29 May 2026. The replacement host serves the same v1 API paths and was
      verified live with DEMO_KEY (HTTP 200, total_results 89,685 electric station
      records, 292,399 ports). SETUP.md section 3 directs the operator to
      developer.nrel.gov/signup for the free key; that URL no longer resolves and keys
      must be obtained from developer.nlr.gov. This is a correction to delivered project
      material, not a specification change.
    evidence_url: "https://developer.nlr.gov/docs/transportation/alt-fuel-stations-v1/"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Update any developer.nrel.gov references in your code to developer.nlr.gov; the
      developer.nrel.gov domain was retired on May 29, 2026.
    evidence_artifact: "docs/evidence/F-5_nlr_host_migration.txt"
    evidence_sha256: "a4cd4dd7316a0659d3f00e8916ed93eb514f024b0ae9c40322e0eec0089acee8"

  - id: F-6
    question: >-
      Is CEJST retrievable, and in what status?
    resolved_value: >-
      The live host is gone and an archived copy is retrievable. Neither
      screeningtool.geoplatform.gov nor static-data-screeningtool.geoplatform.gov has a
      DNS record. The CEJST v2.0 communities CSV (45,316,831 bytes, 136 columns) was
      retrieved successfully through the Internet Archive. This is consistent with
      CLAUDE.md section 8: Executive Order 14008 was revoked on 20 January 2025, so
      CEJST may appear only as an archived historical equity classification, vintage-
      labelled, with the UI stating the framework is no longer in force. Dependence on a
      third-party archive is a single point of failure and a local mirror should be
      taken before Phase 6.
    evidence_url: "https://web.archive.org/web/2024/https://static-data-screeningtool.geoplatform.gov/data-versions/2.0/data/score/downloadable/2.0-communities.csv"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      HTTP 200, 45,316,831 bytes, CSV with 136 columns retrieved from the Internet
      Archive; both live hostnames return no DNS record.
    evidence_artifact: "docs/evidence/F-6_cejst_offline.txt"
    evidence_sha256: "821acf320f77d7193c5c0500a2d8e321e61a5cde6800f5e7838f2ec74f666dcb"

  - id: F-7
    question: >-
      Are block-level population-weighted centroids available, as CLAUDE.md sections 7.5
      and 7.6 assume?
    resolved_value: >-
      NO ready-made product exists at block level; the finest published is block group.
      The CenPop2020 directory publishes only county/, tract/ and blkgrp/, and the block
      path returns HTTP 404. Genuine block-level population weighting is still
      constructible and still free: TIGER/Line tl_{year}_{ss}_tabblock20.zip supplies
      block geometry with INTPTLAT/INTPTLON, and the 2020 P.L. 94-171 redistricting file
      supplies block population, both verified reachable without a key. Section 7.5
      permits 'population-weighted centroids OR block-level allocation' while section
      7.6 requires 'block-level population weights'; which path is taken is a Phase 2
      decision, recorded here so it is made on evidence rather than assumed.
    evidence_url: "https://www2.census.gov/geo/docs/reference/cenpop2020/"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Directory listing publishes blkgrp/, county/ and tract/ only; https://www2.census.
      gov/geo/docs/reference/cenpop2020/block/CenPop2020_Mean_BLK27.txt returns HTTP
      404.
    evidence_artifact: "docs/evidence/F-7_no_block_population_centroids.txt"
    evidence_sha256: "24cf97b163956fd4e50217286075777ebfc7119035e05bf585f9e7a28eb9eead"

  - id: F-8
    question: >-
      Is a national HIFLD electric substation layer obtainable?
    resolved_value: >-
      NOT FOUND. Five distinct searches failed to locate one: the HIFLD ArcGIS
      organisation publishes 526 services of which none is a substation layer; the EIA
      Energy Atlas organisation publishes 79, none matching; hifld-
      geoplatform.hub.arcgis.com/datasets/electric-substations returns HTTP 404; an
      ArcGIS Online title search returned no authoritative national match; and the best
      candidate service holds 128 features against a historical national count on the
      order of 55,000 to 80,000. This degrades CLAUDE.md section 7.8 candidate filtering
      ('within a configured distance of a substation') and section 7.9 grid proximity
      ('distance to nearest HIFLD substation, plus voltage class'). Per directive D8 no
      substitute has been silently adopted. Live HIFLD transmission lines remain
      available at 52,244 features, but line proximity is a weaker proxy than substation
      proximity and would make the directive D6 language constraints more important, not
      less.
    evidence_url: "https://services.arcgis.com/G4S1dGvn7PIgYd6Y/ArcGIS/rest/services/HIFLD_electric_power_substations/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      {"count" : 128}
    evidence_artifact: "docs/evidence/F-8_hifld_substations_absent.txt"
    evidence_sha256: "eb8a17b48db74227993bb57e78d9e937bf67ac2e80723c932f622934a416f64f"

  - id: F-9
    question: >-
      Does the delivered data support domain rule G9's claim of inconsistent state
      reporting vintages, and its Oregon example?
    resolved_value: >-
      NO on both counts. G9 and data/seed/MANIFEST.md both state that Oregon reports
      6,436, below Kansas at 11,271 and Iowa at 9,031, and call that ordering
      implausible. The delivered file records Oregon at 64,361, not 6,436; the stated
      figure appears to be a truncation. At 64,361 the ordering is unremarkable. The
      general claim was tested separately and also fails: rounding every delivered value
      half-up to the nearest 100 reproduces the AFDC 2023 vintage for 51 of 51
      jurisdictions (and 0 of 51 for 2022 or 2024), so the file is one consistent
      vintage across all states rather than a mixture. Because CLAUDE.md section 14
      requires a regression test for every domain rule G1 to G14, a test asserting G9 as
      written would fail against the delivered data. Escalated through
      docs/reports/PLAN_CHANGE_0.md rather than worked around.
    evidence_url: "data/seed/EV_Registration_Counts_by_State.csv"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      Oregon,64361 / Kansas,11271 / Iowa,9031 / Maine,7377 / Total,3555445
    evidence_artifact: "docs/evidence/F-9_g9_oregon_discrepancy.txt"
    evidence_sha256: "f8ad9770ef909f667d07fe20aa7b371cb62f73071a3ec2c8fd315d0797ce2855"

  - id: F-10
    question: >-
      What is the AFDC API rate limit in practice?
    resolved_value: >-
      The shared DEMO_KEY credential is limited to 10 requests per window. Measured by
      exhausting it during the Phase 0 probe run: the endpoint returned HTTP 429 with
      x-ratelimit-limit 10, x-ratelimit-remaining 0 and retry-after 78,590 seconds
      (about 21.8 hours). All three AFDC probe specs share this quota, so one full probe
      run consumes it. A free personal key from developer.nlr.gov is required for
      repeated probing and for any scheduled refresh. No credential is fabricated,
      entered or persisted by this pipeline; the operator supplies NREL_API_KEY in the
      environment.
    evidence_url: "https://developer.nlr.gov/api/alt-fuel-stations/v1.json"
    retrieved_at: "2026-08-19T00:00:00Z"
    evidence_quote: >-
      HTTP 429; x-ratelimit-limit: 10; x-ratelimit-remaining: 0; retry-after: 78590
    evidence_artifact: "docs/evidence/F-10_demo_key_rate_limit.txt"
    evidence_sha256: "cd260d09483e8510085faf32b53084b72f92bb5a325f15e6633d0b1b91cc859b"

  - id: F-11
    question: >-
      A-0.5: are AFDC's year= registration pages contemporaneous annual snapshots, or
      retrospective reconstructions from later VIN data? A page labelled 2020 is not by
      itself proof that its numbers were information available at a 2020 cutoff (D1).
    resolved_value: >-
      PARTIALLY RESOLVED. Stability is established; contemporaneity is not. The 2021
      vintage is byte-identical between its earliest archived capture (2022-08-18) and
      the live page today, 52 of 52 jurisdictions, and the 2020 vintage is likewise
      identical between its 2023-09-12 capture and today, 52 of 52. The series is
      therefore NOT retrospectively revised within the observable window 2022-08-18 to
      2026-08-24. However the Internet Archive holds no capture of this page before
      2022-08-18, and that earliest capture ALREADY offered a full back-series to 2016,
      so the archive cannot show whether any given year page existed during that year.
      For the 2020 and 2021 rolling origins contemporaneity cannot be demonstrated; the
      2022 origin falls inside the observable window. Recorded as
      historical_vintage_semantics = stable_not_revised_within_observable_window with
      contemporaneity = unresolved. Phase 5 must state this limitation explicitly in
      docs/VALIDATION.md. The D1 runtime guard feature_vintage <= prediction_cutoff is
      unaffected: what is unverified is the MEANING of the vintage label, not the
      mechanics of the check.
    evidence_url: "http://web.archive.org/web/20220818053239/https://afdc.energy.gov/vehicle-registration"
    retrieved_at: "2026-08-24T00:00:00Z"
    evidence_quote: >-
      Earliest archived capture 2022-08-18 offers year values 2016 through 2021 and
      displays the 2021 vintage with Oregon at 30,300 and California at 563,100; the
      live page today reports the same figures for 2021.
    evidence_artifact: "docs/evidence/P1-2_a05_vintage_provenance.json"
    evidence_sha256: "5cba5a1275baf76fed03ece8658d6380315c9ce8c47afbf7219ae10fc6c5a587"
