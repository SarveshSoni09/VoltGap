    coverage:
      geographic: "US, all census geographies"
      temporal: "2009 onward, 5-year estimates"
      historical_vintages_available: true
      vintage_field: "year path segment"
      vintage_semantics: "5-year pooled estimate ending in the named year"
    schema:
      join_keys: [GEO_ID]
