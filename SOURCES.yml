# VoltGap source contract
#
# STABLE, HUMAN-REVIEWED. This file records what each source is *expected* to be.
# It changes only by deliberate edit and review.
#
# Live measurements — observed row counts, discovered schema, missingness, retrieval
# metadata, and probe-assigned status — live in the generated sidecar
# SOURCES.observed.json, written by pipeline/discovery/probe.py. That split is an
# approved deviation from CLAUDE.md section 4.1, which originally put both in this
# file; keeping them together made every live refresh dirty the reviewed contract and
# made expectation indistinguishable from observation.
#
# schema.schema_version is the order-sensitive 16-hex hash of the discovered field
# list (pipeline/discovery/measure.py: schema_hash). A column rename, reorder, or
# addition changes it, and probe.py reports the change as drift.
#
# quality.drift_tolerance widens quality.expected_row_count when drift is evaluated.
# 0.20 is the provisional default agreed for previously unseen sources; frozen seed
# fixtures carry 0.0 because their bytes never change.

meta:
  contract_version: 1
  phase: 0
  written_by: Claude Code
  reviewed_by: pending project owner review
  notes: >-
    Every entry below was probed live on 2026-08-19 UTC. Nothing here is assumed from
    documentation alone; where an expectation could not be verified it is recorded as
    such in known_limitations rather than filled with a plausible default (directive D8).

# --------------------------------------------------------------------------------
# Reusable blocks
# --------------------------------------------------------------------------------

.anchors:
  afdc_registration_base: &afdc_registration_base
    tier: core
    retrieval:
      method: scrape
      endpoint: "https://afdc.energy.gov/vehicle-registration?year={year}"
      auth: none
      rate_limit: "not advertised; no 429 observed across 10 sequential requests"
    coverage:
      geographic: "US 50 states + DC"
      historical_vintages_available: true
      vintage_field: "year query parameter"
      vintage_semantics: "registered light-duty stock through the selected year"
      historical_vintage_semantics: stable_not_revised_within_observable_window
      contemporaneity: unresolved
      observable_window: "2022-08-18 to 2026-08-24"
      provenance_evidence: docs/evidence/P1-2_a05_vintage_provenance.json
    schema:
      join_keys: [State]
      stable_keys: true
      schema_version: fdbd64efe4532f77
    quality:
      expected_row_count: [52, 52]
      drift_tolerance: 0.0
      expected_range_derivation: >-
        Exact. 51 jurisdictions (50 states + DC) plus one "United States" total row.
        Verified identical across all ten year pages probed.
    license: "US Government work, public domain. Underlying counts derived from Experian."
    update_cadence: "annual"
    fallback_source: seed_state_ev_registrations
    used_by: [demand_reconciliation, deployment_alignment]
    backtest_eligible: true
    known_limitations:
      - "Counts are rounded to the nearest 100 vehicles."
      - >-
        The table contains a "United States" total row that must be excluded before
        aggregation (domain rule G8).
      - >-
        Whether each year page is a contemporaneous snapshot or a retrospective
        reconstruction from current VIN data is not stated by the publisher. If it is
        retrospective, the series is survivorship-affected. Recorded as assumption
        A-0.5 and to be tested in Phase 5.
      - "No JSON or CSV endpoint exists; HTML scraping is the only retrieval method."

  atlas_base: &atlas_base
    tier: core
    retrieval:
      method: bulk_download
      endpoint: "https://www.atlasevhub.com/public/dmv/{slug}.csv"
      auth: none
      rate_limit: "not advertised; no throttling observed"
    coverage:
      geographic: "single state"
      temporal: "vehicle-level registrations with a repeated DMV snapshot series"
      historical_vintages_available: true
      vintage_field: "DMV Snapshot (Date)"
      vintage_semantics: "observed registrations as of the named DMV snapshot"
    quality:
      drift_tolerance: 0.20
      expected_range_derivation: >-
        Provisional. Derived from the first verified live observation of a 65,536-byte
        bounded sample, widened by the default +/-20% tolerance. The full files are
        16 MB to 1.3 GB and are never fully retrieved by the probe.
    license: "Published for public use by Atlas Public Policy; per-state DMV terms apply."
    update_cadence: "varies by state, monthly to annual"
    fallback_source: none
    used_by: [demand_model, demand_validation, uncertainty_tiering]
    backtest_eligible: true
    known_limitations:
      - >-
        The host advertises accept-ranges: bytes and then ignores the Range request
        header, answering HTTP 200 with the entire file. The probe bounds the transfer
        by streaming and cutting off locally.
      - >-
        ZIP Code granularity does not nest inside census tracts. A ZIP-to-tract
        crosswalk is required before these states can be used at tract grain
        (assumption A-0.7).
      - >-
        Vehicle Count is a per-row count field, not an implicit 1; rows must be summed
        on Vehicle Count rather than counted.

  seed_frozen: &seed_frozen
    tier: core
    retrieval:
      method: bulk_download
      endpoint: "delivered file in data/seed/, see data/seed/SEED_INVENTORY.md"
      auth: none
      rate_limit: "not applicable"
    update_cadence: "never; frozen fixture"
    backtest_eligible: false

# --------------------------------------------------------------------------------
# Sources
