sources:

  # ---- AFDC (NREL / National Laboratory of the Rockies) --------------------------

  - id: afdc_stations
    name: AFDC Alternative Fuel Stations (electric)
    tier: core
    retrieval:
      method: rest_api
      endpoint: "https://developer.nlr.gov/api/alt-fuel-stations/v1.json"
      auth: api_key_free
      rate_limit: >-
        Measured empirically: the shared DEMO_KEY credential returned HTTP 429 with
        x-ratelimit-limit: 10 and retry-after: 78590 after ten requests. A free
        personal key raises this substantially.
    coverage:
      geographic: "US 50 states + DC + PR, plus Canada when country is not filtered"
      temporal: "current snapshot only"
      historical_vintages_available: false
      vintage_field: "Snapshot Date (charging-units export) / last-updated endpoint"
      vintage_semantics: "present-day operational snapshot"
    schema:
      join_keys: [ID]
      stable_keys: true
      schema_version: f6860736f1304654
      expected_field_count: 75
    quality:
      expected_row_count: [80000, 100000]
      drift_tolerance: 0.20
      expected_range_derivation: >-
        Anchored on the live envelope observed during Phase 0 discovery on
        2026-08-19: total_results 89,685 electric station records, 292,399 ports. The
        Dec 2024 seed snapshot held 79,618 records, so the range spans both and is
        widened by the default tolerance.
    license: "US Government work, public domain"
    update_cadence: "daily"
    fallback_source: seed_afdc_stations_national_20241211
    used_by: [supply, access, deployment_alignment]
    backtest_eligible: false
    known_limitations:
      - >-
        A record is one network's presence at a site, not a port and not a unit of
        capacity (domain rule G1).
      - "Status Code E / T / P; only E is operational supply (G2)."
      - "Access Code includes private, which is not public supply (G3)."
      - >-
        Exact coordinate duplicates are usually co-located multi-network
        infrastructure and must be aggregated to a site, not deleted (G4).
      - >-
        Open Date may reflect first appearance in the Station Locator rather than
        actual opening, for automated network feeds (G10).
      - >-
        No historical snapshots are served, so any reconstructed historical network is
        survivorship-biased and is labelled an approximate reconstruction (G11).
      - >-
        Not probed successfully in the final Phase 0 run: the DEMO_KEY hourly quota
        was exhausted by earlier probes and the endpoint returned HTTP 429. The 75-
        column schema was instead verified live against the charging-units export,
        whose first 75 columns are byte-identical to this schema.

  - id: afdc_last_updated
    name: AFDC Station Locator last-updated timestamp
    tier: core
    retrieval:
      method: rest_api
      endpoint: "https://developer.nlr.gov/api/alt-fuel-stations/v1/last-updated.json"
      auth: api_key_free
      rate_limit: "shared with afdc_stations; DEMO_KEY limit measured at 10 per window"
    coverage:
      geographic: "not applicable"
      temporal: "single timestamp"
      historical_vintages_available: false
      vintage_field: "last_updated"
      vintage_semantics: "timestamp of the current AFDC snapshot"
    schema:
      join_keys: []
      stable_keys: true
      schema_version: 0ec0d1a693f910d2
      expected_field_count: 1
    quality:
      expected_row_count: [1, 1]
      drift_tolerance: 0.0
      expected_range_derivation: "Exact. The endpoint returns a single object."
    license: "US Government work, public domain"
    update_cadence: "daily"
    fallback_source: none
    used_by: [manifest_freshness, supply]
    backtest_eligible: false
    known_limitations:
      - "Establishes the vintage of the current snapshot only; no history is served."

  - id: afdc_charging_units
    name: AFDC EV Charging Units export
    tier: core
    retrieval:
      method: rest_api
      endpoint: "https://developer.nlr.gov/api/alt-fuel-stations/v1/ev-charging-units.csv"
      auth: api_key_free
      rate_limit: "shared with afdc_stations; DEMO_KEY limit measured at 10 per window"
    coverage:
      geographic: "US 50 states + DC + PR; probed Minnesota-scoped"
      temporal: "current snapshot only"
      historical_vintages_available: false
      vintage_field: "Snapshot Date"
      vintage_semantics: >-
        Present-day snapshot. The column exists but the endpoint accepts no
        snapshot/date parameter, so prior snapshots cannot be requested.
    schema:
      # CORRECTED 2026-08-19, impact-log entry I-1. This entry previously recorded
      # stable_keys: true, which implied row-level identity the source does not
      # provide. `ID` is the STATION parent key, not charging-unit row identity.
      parent_key: [ID]
      row_identity: none
      join_keys: [ID]
      stable_keys: false
      schema_version: c7ef314df7ff8fce
      expected_field_count: 86
    quality:
      expected_row_count: [2400, 3600]
      drift_tolerance: 0.20
      expected_range_derivation: >-
        Provisional, for the Minnesota-scoped probe only. First verified live
        observation was 2,951 unit rows for Minnesota on 2026-08-19, widened by the
        default tolerance. The national export holds 292,435 unit rows.
    license: "US Government work, public domain"
    update_cadence: "daily"
    fallback_source: afdc_stations
    used_by: [supply, power_ladder]
    backtest_eligible: false
    known_limitations:
      - >-
        One row is a charging unit that may hold one or more ports and one or more
        connectors; rows are not ports.
      - >-
        55 rows nationally report a power output of exactly 0.00 kW, which is not a
        valid power and must not be treated as a rung-1 reported value.
      - >-
        Rung-1 power coverage is uneven by connector: 99.9% for CCS and CHAdeMO but
        73.4% for J3400 and 81.4% for J1772 (port-weighted, national).
      - >-
        NO CHARGING-UNIT IDENTIFIER EXISTS. The export carries no unit id column; ID
        is the station parent key, and 89,687 station IDs span 292,435 unit rows.
        65.9% of rows (192,796) are byte-identical duplicates of another row and 90.9%
        participate in an identical-row group; the largest group is 410 rows. Rows
        cannot be distinguished by content, only by row order, which no refresh
        guarantees. stable_keys is therefore false, and charging_unit_record_key is a
        synthetic per-snapshot key carrying no longitudinal meaning. See CLAUDE.md
        section 6.1.1 and docs/reports/IMPACT_LOG.md entry I-1.
      - >-
        The duplicates are NOT data errors. Row count reconciles to the station's
        reported L1+L2+DCFC totals for 100.0% of stations (89,665 of 89,687), so the
        export is one row per EVSE and identical rows are real distinct physical units
        indistinguishable in every reported attribute - the same situation as domain
        rule G4 for coordinate duplicates. Aggregate counts and capacity are therefore
        trustworthy even though identity is not.
      - >-
        Connectors are exposed as per-type counts and power on a unit row, not as
        identified connectors. Model them at (charging_unit_record_key, connector_type)
        grain; never manufacture connector_id rows from counts.

